name: Passport pickup check

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "17 * * * *"
  # the scheudled function has been commented out. for instruction go: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
concurrency:
  group: passport-pickup-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check pickup appointment
        env:
          PASSPORT_PICKUP_UID: ${{ secrets.PASSPORT_PICKUP_UID }}
        run: npm run check

      - name: Load previous monitor state
        if: always()
        run: |
          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch origin monitor-state:refs/remotes/origin/monitor-state
            git show origin/monitor-state:latest-state.json > previous-state.json || true
          fi

      - name: Read check result
        if: always()
        id: result
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('artifacts/latest-state.json', 'utf8'));
          const previous = fs.existsSync('previous-state.json')
            ? JSON.parse(fs.readFileSync('previous-state.json', 'utf8'))
            : null;
          const fingerprint = (value) => JSON.stringify({
            status: value?.status ?? null,
            unavailableMatches: value?.unavailableMatches ?? [],
            availableMatches: value?.availableMatches ?? [],
            error: value?.error ?? null
          });
          const beijingHour = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Shanghai',
            hour: '2-digit',
            hour12: false
          }).formatToParts(new Date()).find((part) => part.type === 'hour')?.value;
          const isFirstSuccessfulRun = (!previous || previous.status === 'error') && state.status !== 'error';
          const changed = previous && fingerprint(previous) !== fingerprint(state);
          const dailyStatus = beijingHour === '23';
          const error = state.status === 'error';
          const available = state.status === 'appointment-available';
          const manualRun = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          const notify = manualRun || isFirstSuccessfulRun || changed || dailyStatus || error;
          const reason = error
            ? 'check-error'
            : available
              ? 'appointment-available'
              : isFirstSuccessfulRun
                ? 'first-successful-run'
                : changed
                  ? 'status-changed'
                  : dailyStatus
                    ? 'daily-status'
                    : manualRun
                      ? 'manual-run'
                    : 'no-notification';
          const statusLabel = {
            'appointment-available': '可能可以预约',
            unavailable: '目前不可预约',
            'checked-no-known-result': '已查询，但未识别明确结果',
            'needs-uid': '缺少 UID',
            'loaded-without-known-text': '页面已打开，但未识别入口',
            error: '检查失败',
            unknown: '未知'
          };
          const reasonLabel = {
            'first-successful-run': '第一次成功运行',
            'status-changed': '状态发生变化',
            'daily-status': '每日状态汇总',
            'appointment-available': '可能可以预约',
            'check-error': '检查脚本报错',
            'manual-run': '手动运行测试',
            'no-notification': '无需通知'
          };
          const checkedAtBeijing = new Intl.DateTimeFormat('zh-CN', {
            timeZone: 'Asia/Shanghai',
            dateStyle: 'medium',
            timeStyle: 'short'
          }).format(new Date(state.checkedAt));
          const currentLabel = statusLabel[state.status] ?? state.status;
          const previousLabel = previous ? (statusLabel[previous.status] ?? previous.status) : '无';
          const subjectStatus = state.status === 'appointment-available'
            ? '【护照自取】可能可以预约了'
            : state.status === 'error'
              ? '【护照自取】检查失败'
              : reason === 'daily-status'
                ? `【护照自取】每日状态：${currentLabel}`
                : reason === 'first-successful-run'
                  ? `【护照自取】监控已启动：${currentLabel}`
                  : `【护照自取】状态更新：${previousLabel} -> ${currentLabel}`;
          const escapeHtml = (value) => String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
          const matchText = (items) => (items ?? []).length
            ? items.map((item) => `<li>${escapeHtml(item)}</li>`).join('')
            : '<li>无</li>';
          const plainBody = [
            `护照自取预约监控`,
            `当前结论：${currentLabel}`,
            `通知原因：${reasonLabel[reason] ?? reason}`,
            `上次状态：${previousLabel}`,
            `检查时间：${checkedAtBeijing} 北京时间`,
            `不可预约匹配：${(state.unavailableMatches ?? []).join(', ') || '无'}`,
            `可预约匹配：${(state.availableMatches ?? []).join(', ') || '无'}`,
            `错误：${state.error ?? '无'}`,
            '',
            '预约网站：https://schedule.gtspremium.com/'
          ].join('\n');
          const htmlBody = `<!doctype html>
          <html>
            <body style="margin:0;background:#f6f7f9;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
              <div style="max-width:640px;margin:0 auto;padding:28px 18px;">
                <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;">
                  <div style="padding:20px 22px;border-bottom:1px solid #e5e7eb;">
                    <div style="font-size:13px;color:#6b7280;margin-bottom:6px;">护照自取预约监控</div>
                    <div style="font-size:24px;font-weight:700;color:${state.status === 'appointment-available' ? '#047857' : state.status === 'error' ? '#b91c1c' : '#111827'};">
                      ${escapeHtml(currentLabel)}
                    </div>
                  </div>
                  <div style="padding:18px 22px;">
                    <table style="width:100%;border-collapse:collapse;font-size:14px;">
                      <tr><td style="padding:8px 0;color:#6b7280;width:120px;">通知原因</td><td style="padding:8px 0;font-weight:600;">${escapeHtml(reasonLabel[reason] ?? reason)}</td></tr>
                      <tr><td style="padding:8px 0;color:#6b7280;">上次状态</td><td style="padding:8px 0;">${escapeHtml(previousLabel)}</td></tr>
                      <tr><td style="padding:8px 0;color:#6b7280;">检查时间</td><td style="padding:8px 0;">${escapeHtml(checkedAtBeijing)} 北京时间</td></tr>
                    </table>
                    <div style="height:1px;background:#e5e7eb;margin:14px 0;"></div>
                    <div style="font-size:14px;color:#374151;line-height:1.6;">
                      <div style="font-weight:700;margin-bottom:4px;">官网匹配到的不可预约文字</div>
                      <ul style="margin-top:0;padding-left:20px;">${matchText(state.unavailableMatches)}</ul>
                      <div style="font-weight:700;margin:14px 0 4px;">官网匹配到的可预约文字</div>
                      <ul style="margin-top:0;padding-left:20px;">${matchText(state.availableMatches)}</ul>
                      ${state.error ? `<div style="margin-top:14px;padding:12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b;"><strong>错误：</strong>${escapeHtml(state.error)}</div>` : ''}
                    </div>
                    <a href="https://schedule.gtspremium.com/" style="display:inline-block;margin-top:16px;padding:10px 14px;border-radius:8px;background:#111827;color:#ffffff;text-decoration:none;font-size:14px;">打开预约网站</a>
                  </div>
                </div>
              </div>
            </body>
          </html>`;
          const lines = [
            `status=${state.status}`,
            `notify=${notify}`,
            `reason=${reason}`,
            `subject=${subjectStatus}`,
            'body<<EOF',
            plainBody,
            'EOF'
            ,
            'html_body<<HTMLEOF',
            htmlBody,
            'HTMLEOF'
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join('\n')}\n`);
          NODE

      - name: Print notification decision
        if: always()
        run: |
          echo "event=${{ github.event_name }}"
          echo "notify=${{ steps.result.outputs.notify }}"
          echo "reason=${{ steps.result.outputs.reason }}"
          echo "status=${{ steps.result.outputs.status }}"

      - name: Send email notification
        if: github.event_name == 'workflow_dispatch' || steps.result.outputs.notify == 'true'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT: ${{ steps.result.outputs.subject }}
          EMAIL_BODY: ${{ steps.result.outputs.body }}
          EMAIL_HTML_BODY: ${{ steps.result.outputs.html_body }}
        run: node src/send-email.js

      - name: Save monitor state
        if: always()
        run: |
          if [ ! -f artifacts/latest-state.json ]; then
            exit 0
          fi
          cp artifacts/latest-state.json "$RUNNER_TEMP/latest-state.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin monitor-state >/dev/null 2>&1; then
            git fetch origin monitor-state:refs/remotes/origin/monitor-state
            git switch --force-create monitor-state origin/monitor-state
          else
            git switch --orphan monitor-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$RUNNER_TEMP/latest-state.json" latest-state.json
          git add latest-state.json
          git commit -m "Update monitor state" || exit 0
          git push origin monitor-state
