name: Passport pickup check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: passport-pickup-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check pickup appointment
        env:
          PASSPORT_PICKUP_UID: ${{ secrets.PASSPORT_PICKUP_UID }}
        run: npm run check

      - name: Read check result
        if: always()
        id: result
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const state = JSON.parse(fs.readFileSync('artifacts/latest-state.json', 'utf8'));
          const notify = state.status === 'appointment-available' || state.status === 'error';
          const lines = [
            `status=${state.status}`,
            `notify=${notify}`,
            `subject=${state.status === 'appointment-available' ? 'Passport pickup appointment may be available' : 'Passport pickup tracker check failed'}`,
            'body<<EOF',
            `Status: ${state.status}`,
            `Checked at: ${state.checkedAt}`,
            `Unavailable matches: ${(state.unavailableMatches ?? []).join(', ') || 'none'}`,
            `Available matches: ${(state.availableMatches ?? []).join(', ') || 'none'}`,
            `Error: ${state.error ?? 'none'}`,
            '',
            'Booking site: https://schedule.gtspremium.com/',
            'EOF'
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join('\n')}\n`);
          NODE

      - name: Send email notification
        if: steps.result.outputs.notify == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.result.outputs.subject }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.GMAIL_USERNAME }}
          body: ${{ steps.result.outputs.body }}
