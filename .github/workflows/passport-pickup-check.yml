name: Passport pickup check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: passport-pickup-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check pickup appointment
        env:
          PASSPORT_PICKUP_UID: ${{ secrets.PASSPORT_PICKUP_UID }}
        run: npm run check

      - name: Notify when available or failed
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/notify-telegram.js
